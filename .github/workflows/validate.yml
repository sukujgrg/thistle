name: Validate
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: App and release regressions
        run: make test
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Release build
        run: make app BUILD_CONFIGURATION=release SIGNING_IDENTITY=-
      - name: Verify Apple Silicon binaries and built metadata
        run: |
          python3 - <<'PY'
          import plistlib
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from release import verify_arm64_app
          app = Path("bin/Thistle.app")
          verify_arm64_app(app)
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          assert info["CFBundleShortVersionString"] == Path("VERSION").read_text().strip()
          assert info["CFBundleIdentifier"] == "dev.thistle"
          assert info["LSMinimumSystemVersion"] == "26.0"
          print(f"Thistle {info['CFBundleShortVersionString']} with arm64 engine and updater")
          PY
